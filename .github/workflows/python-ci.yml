name: Python CI

on:
  push:
    branches: [v2.0]
  pull_request:
    branches: [v2.0]

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m compileall -q .
